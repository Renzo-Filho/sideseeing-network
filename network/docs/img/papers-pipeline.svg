<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1320" width="1120" height="1320" font-family="Helvetica, Arial, sans-serif">
<!-- The pipeline to both papers (PAPERS.md, section 2). To update a step's status, change its group's class: done, doing, todo. -->
<style>
  text { font-size: 12.5px; text-anchor: middle; }
  .t { font-size: 14px; font-weight: bold; }
  .bt { font-size: 13px; font-weight: bold; text-anchor: start; fill: #0f172a; }
  .lg { text-anchor: start; fill: #334155; }
  .band { fill: #f8fafc; stroke: #cbd5e1; }
  .done rect { fill: #dcfce7; stroke: #16a34a; } .done text { fill: #14532d; }
  .doing rect { fill: #fef3c7; stroke: #d97706; } .doing text { fill: #78350f; }
  .todo rect { fill: #f1f5f9; stroke: #94a3b8; } .todo text { fill: #334155; }
  .result rect { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; } .result text { fill: #1e3a8a; }
  .edge { fill: none; stroke: #64748b; stroke-width: 1.4; }
  .dash { stroke-dasharray: 5 4; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
