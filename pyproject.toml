[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sideseeing-network"
version = "0.1.0"
description = "Reproducible São Paulo and Chicago urban-form similarity research"
authors = [
    {name = "Principal GIS Software Engineer"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "ipykernel>=7.3.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pyogrio>=0.12.1",
    "pyproj>=3.7.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]
